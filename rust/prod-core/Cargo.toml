[package]
name = "prod-core"
version = "0.1.0"
edition = "2021"
authors = ["UOR Foundation"]
license = "MIT"

[features]
default = ["std"]
std = []

# Spelled out rather than `[lints] workspace = true`, because Cargo does not
# allow combining the workspace opt-in with extra tables and this crate needs
# both: it is the one that ships generated code to callers, so it also bans the
# panicking escape hatches the generated arithmetic used to rely on.
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# A slice index is a panic path even where an argument says it cannot be taken.
# The generated list writers used to have two; the internal Rust printer now
# spells both as `get_mut`.
#
# Note what this lint does and does not reach: clippy skips proc-macro
# expansions, so it never saw `prod_defs!`'s output and would not have caught
# those two. It holds THIS crate's hand-written half -- the runtime support the
# generated code calls into -- to the same rule, which is the half a lint can
# actually police.
indexing_slicing = "deny"

[dependencies]
prod-ir = { path = "../prod-ir" }
prod-macros = { path = "../prod-macros" }

[dev-dependencies]
# Test-only: quarantines the `unsafe impl GlobalAlloc` this crate's own
# `forbid(unsafe_code)` would otherwise reject. See `tests/no_alloc.rs`.
prod-alloc-counter = { path = "../prod-alloc-counter" }
